name: CI

on:
  push:
    branches:
      - dev
      - "feature/**"
  pull_request:
    branches:
      - dev

jobs:
  validate-python-and-cdk:
    name: Validate Python and CDK
    runs-on: ubuntu-latest

    env:
      AWS_ACCOUNT_ID: "000000000000"
      AWS_REGION: us-east-1
      ENVIRONMENT: dev
      PROJECT_NAME: wistia-video-analysis
      S3_BUCKET_NAME: ci-wistia-video-analysis-placeholder
      WISTIA_SECRET_NAME: /wistia-video-analysis/dev/wistia-api-token
      GLUE_DATABASE_NAME: wistia_video_analytics
      PIPELINE_SCHEDULE_ENABLED: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r infrastructure/requirements.txt

      - name: Install AWS CDK CLI
        run: |
          npm install -g aws-cdk

      - name: Compile Python source files
        run: |
          python -m py_compile \
            src/common/paths.py \
            src/ingestion/wistia_client.py \
            src/ingestion/watermark.py \
            src/ingestion/ingest_wistia_raw.py \
            src/ingestion/explore_wistia_api.py \
            src/ingestion/explore_wistia_visitors.py \
            src/transforms/bronze_to_silver.py \
            src/transforms/silver_to_gold.py \
            src/quality/check_gold.py \
            infrastructure/app.py \
            infrastructure/wistia_video_analysis_stack.py

      - name: Run tests if present
        run: |
          if find tests -type f -name "test_*.py" 2>/dev/null | grep -q .; then
            python -m pytest -q
          else
            echo "No tests directory or test_*.py files found. Skipping pytest."
          fi

      - name: Synthesize CDK stack
        working-directory: infrastructure
        run: |
          cdk synth
