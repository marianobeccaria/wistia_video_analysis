name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment name
        required: true
        default: dev
      aws_region:
        description: AWS region
        required: true
        default: us-east-1
      s3_bucket_name:
        description: Existing Wistia data lake bucket name
        required: true
        default: mbeccaria-dea-wistia-analytics
      pipeline_schedule_enabled:
        description: Enable scheduled production runs
        required: true
        default: "false"

jobs:
  deploy:
    name: CDK Deploy
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    env:
      ENVIRONMENT: ${{ inputs.environment }}
      AWS_REGION: ${{ inputs.aws_region }}
      PROJECT_NAME: wistia-video-analysis
      S3_BUCKET_NAME: ${{ inputs.s3_bucket_name }}
      WISTIA_SECRET_NAME: /wistia-video-analysis/${{ inputs.environment }}/wistia-api-token
      GLUE_DATABASE_NAME: wistia_video_analytics
      PIPELINE_SCHEDULE_ENABLED: ${{ inputs.pipeline_schedule_enabled }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}

      - name: Set AWS account id
        run: |
          echo "AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_ENV"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r infrastructure/requirements.txt

      - name: Install AWS CDK CLI
        run: |
          npm install -g aws-cdk

      - name: CDK synth
        working-directory: infrastructure
        run: |
          cdk synth

      - name: CDK deploy
        working-directory: infrastructure
        run: |
          cdk deploy --require-approval never
